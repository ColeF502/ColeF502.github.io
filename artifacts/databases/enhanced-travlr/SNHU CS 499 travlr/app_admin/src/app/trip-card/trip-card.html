<div class="card">
  <div class="card-header">{{ trip.name }}</div>

  <img src="assets/images/{{ trip.image }}" alt="trip thumbnail" class="card-img-top">

  <div class="card-body">
    <h6 class="card-subtitle mb-2 text-muted">
      {{ trip.resort }}
    </h6>

    <p class="card-subtitle mt-3 mb-3 text-muted">
      {{ trip.length }} only {{ trip.perPerson | currency:'USD':'symbol' }} per person
    </p>

    <p class="card-text" [innerHTML]="trip.description">
    </p>

    <div *ngIf="isLoggedIn()">
      <div *ngIf="isDeleting" class="alert alert-info">
        Deleting trip...
      </div>

      <div *ngIf="successMessage" class="alert alert-success">
        {{ successMessage }}
      </div>

      <div *ngIf="errorMessage" class="alert alert-danger">
        {{ errorMessage }}
      </div>

      <button (click)="editTrip(trip)" class="btn btn-info" [disabled]="isDeleting">
        Edit Trip
      </button>

      <button (click)="deleteTrip(trip)" class="btn btn-danger" [disabled]="isDeleting">
        {{ isDeleting ? 'Deleting...' : 'Delete Trip' }}
      </button>
    </div>
  </div>
</div>
